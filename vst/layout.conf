# Euclidier MPC skin layout: reuses the exact palette from addon/shadow_page.conf
# (pastel-lime chassis / charcoal boxes / off-white ink, style=td3) so the plugin
# reads as the same design as the Force Shadow GUI page. GLOBAL (all 8 lanes'
# enable/steps/fill at a glance) plus one tab per lane (LANE 1..8, same per-lane
# parameter set as the shadow page's DETAIL tab) plus PRESETS (shadow page's
# PRESETS tab). MPC skins have no custom-drawn widget type (mpc-vst-plugins
# docs/NOTES.md "No draggable/graph widgets"), so the shadow page's live strip/ring
# pattern view can't be reproduced -- every other control (enable, note/drum mode,
# division, steps/fill/shift/loop, note, channel, gate, velocity, humanize, preset
# select/load/save, randomizer) is a native knob/toggle/enum control, same as the
# shadow page's DETAIL tiles.
style=td3
theme_bg=8fd94a
theme_panel=8fd94a
theme_line=0e110e
theme_ink=f3f0e6
theme_ink_dim=9a9d92
theme_ink_faint=5f635a
theme_accent=8fd94a
theme_accent_hi=b9ec7c
theme_knob_face=2c312c
theme_knob_ring=050505
theme_bar=6fbf2e
theme_seg_active=8fd94a
theme_seg_inactive=2c312c
theme_seg_active_tx=1f2320
theme_btn_text=1f2320
theme_well=0e110e
theme_knob_off=4a4f48
theme_tab_on=1f2320
theme_tab_on_tx=8fd94a
theme_lcd=0e110e
theme_box=1f2320
theme_btn_bg=f3f0e6
theme_chrome_ink=1f2320
theme_go_on=7ad34d
theme_go_off=ff6b4a
theme_tabs=6fbf2e

[tab GLOBAL]
frame x=36 y=88 w=1207 h=624 title="GLOBAL"
toggle cx=110 cy=160 label="L1" key=l1_enable
toggle cx=248 cy=160 label="L2" key=l2_enable
toggle cx=386 cy=160 label="L3" key=l3_enable
toggle cx=524 cy=160 label="L4" key=l4_enable
toggle cx=662 cy=160 label="L5" key=l5_enable
toggle cx=800 cy=160 label="L6" key=l6_enable
toggle cx=938 cy=160 label="L7" key=l7_enable
toggle cx=1076 cy=160 label="L8" key=l8_enable
knob cx=110 cy=330 r=40 label="STEPS" key=l1_steps
knob cx=248 cy=330 r=40 label="STEPS" key=l2_steps
knob cx=386 cy=330 r=40 label="STEPS" key=l3_steps
knob cx=524 cy=330 r=40 label="STEPS" key=l4_steps
knob cx=662 cy=330 r=40 label="STEPS" key=l5_steps
knob cx=800 cy=330 r=40 label="STEPS" key=l6_steps
knob cx=938 cy=330 r=40 label="STEPS" key=l7_steps
knob cx=1076 cy=330 r=40 label="STEPS" key=l8_steps
knob cx=110 cy=520 r=40 label="FILL" key=l1_fill
knob cx=248 cy=520 r=40 label="FILL" key=l2_fill
knob cx=386 cy=520 r=40 label="FILL" key=l3_fill
knob cx=524 cy=520 r=40 label="FILL" key=l4_fill
knob cx=662 cy=520 r=40 label="FILL" key=l5_fill
knob cx=800 cy=520 r=40 label="FILL" key=l6_fill
knob cx=938 cy=520 r=40 label="FILL" key=l7_fill
knob cx=1076 cy=520 r=40 label="FILL" key=l8_fill
qlinks "LANES 1-4" = l1_enable,l1_steps,l1_fill,l2_enable,l2_steps,l2_fill,l3_enable,l3_steps,l3_fill,l4_enable,l4_steps,l4_fill
qlinks "LANES 5-8" = l5_enable,l5_steps,l5_fill,l6_enable,l6_steps,l6_fill,l7_enable,l7_steps,l7_fill,l8_enable,l8_steps,l8_fill

[tab LANE 1]
frame x=36 y=88 w=1207 h=624 title="LANE 1"
toggle cx=140 cy=170 label="ENABLE" key=l1_enable
enum_h cx=380 cy=170 label="MODE" key=l1_mode sw=90
enum_h cx=650 cy=170 label="DIV" key=l1_div sw=80 rows=2
knob cx=140 cy=340 r=42 label="STEPS" key=l1_steps
knob cx=300 cy=340 r=42 label="FILL" key=l1_fill
knob cx=460 cy=340 r=42 label="SHIFT" key=l1_shift
knob cx=620 cy=340 r=42 label="LOOP" key=l1_loop
knob cx=780 cy=340 r=42 label="NOTE" key=l1_note
knob cx=940 cy=340 r=42 label="CHANNEL" key=l1_ch
knob cx=200 cy=530 r=42 label="GATE" key=l1_gate
knob cx=420 cy=530 r=42 label="VELOCITY" key=l1_vel
knob cx=640 cy=530 r=42 label="HUMANIZE" key=l1_velh
qlinks "LANE 1" = l1_enable,l1_mode,l1_div,l1_steps,l1_fill,l1_shift,l1_loop,l1_note,l1_ch,l1_gate,l1_vel,l1_velh

